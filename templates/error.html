{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block layout %}
<div class="min-vh-100 d-grid place-items-center" style="place-items:center">
  <div class="bb-card p-5 text-center" style="max-width:520px;margin:10vh auto">
    <div class="display-4 fw-bold text-primary">{{ code }}</div>
    <h1 class="h4">{{ title }}</h1>
    <p class="text-muted">{{ message }}</p>
    <a class="btn btn-primary" href="{{ url_for('dashboard.home') }}"><i class="bi bi-house"></i> Back to dashboard</a>
  </div>
</div>
{% endblock %}
